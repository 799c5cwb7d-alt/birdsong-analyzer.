  if (!k) { k = get(localStorage, 'bsa-key'); u = get(localStorage, 'bsa-user'); }
  if (k && u && USERS[u]) {
    $('f').style.visibility = 'hidden';
    openApp(dec(k), u).catch(function () { try { sessionStorage.removeItem('bsa-key'); localStorage.removeItem('bsa-key'); } catch (e) {} $('f').style.visibility = ''; });
  }
})();
</script>
